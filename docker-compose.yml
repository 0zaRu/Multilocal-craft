# Lo lanza scripts/iniciar (que pone MLC_IP = IP de ZeroTier de este equipo).
# Versiones y modo de Geyser en .env (los mantiene scripts/actualizar).
services:
  mc-server:
    image: itzg/minecraft-server:java${JAVA_VERSION:-25}
    container_name: mc-server
    ports:
      - "${MLC_IP:-0.0.0.0}:60068:60068"          # Java
    environment:
      EULA: "TRUE"
      # El jar lo gestiona scripts/actualizar: Docker y terminal usan exactamente el mismo
      TYPE: "CUSTOM"
      CUSTOM_SERVER: "/data/${PAPER_JAR}"
      VERSION: "${MC_VERSION}"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "potato"
      INIT_MEMORY: "2G"
      MAX_MEMORY: "16G"
    volumes:
      - "./server 2025:/data"
    restart: always

  # Geyser (Bedrock / móviles): contenedor propio, llega al servidor Java por el nombre mc-server
  geyser:
    build:
      context: .
      dockerfile: scripts/docker/geyser.Dockerfile
      args:
        JAVA_VERSION: "${JAVA_VERSION:-25}"
    container_name: mc-geyser
    ports:
      - "${MLC_IP:-0.0.0.0}:60069:60069/udp"      # Bedrock (RakNet)
      - "${MLC_IP:-0.0.0.0}:60069:60069/tcp"      # Bedrock (señalización NetherNet)
      - "${MLC_IP:-0.0.0.0}:60070:60070/udp"      # Bedrock (NetherNet/WebRTC)
    environment:
      GEYSER_MODE: "${GEYSER_MODE:-ondemand}"
      MLC_IP: "${MLC_IP:-}"
    depends_on:
      - mc-server
    volumes:
      - "./server 2025:/data"
    restart: always
